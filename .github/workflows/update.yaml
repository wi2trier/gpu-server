on:
  workflow_dispatch:
  schedule:
    # every Monday at midnight
    - cron: "0 0 * * 1"
jobs:
  update:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: fregante/setup-git-user@024bc0b8e177d7e77203b48dab6fb45666854b35 # v2
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          extra-conf: |
            accept-flake-config = true
            commit-lock-file-summary = chore(deps): update flake.lock
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: wi2trier
          authToken: ${{ secrets.CACHIX_TOKEN }}
      - name: nix flake update
        run: nix flake update --commit-lock-file
      - name: nix flake check
        run: nix flake check --show-trace
      - run: git push
